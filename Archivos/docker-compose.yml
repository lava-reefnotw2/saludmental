version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sp07
      POSTGRES_PASSWORD: sp07_dev_password
      POSTGRES_DB: sp07_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sp07"]
      interval: 5s

  dashboard:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY . .
        CMD ["streamlit", "run", "streamlit_app/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://sp07:sp07_dev_password@db:5432/sp07_db
    ports:
      - "8501:8501"

volumes:
  pgdata:
